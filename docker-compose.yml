version: '3.8'

services:
  docbook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docbook_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=docbook_production_super_secret_jwt_key_2026
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=/app/data/docbook.db
      - CORS_ORIGIN=*
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=1000
    volumes:
      # Persistent local storage for SQLite database and uploaded assets
      - ./data:/app/data
      - ./public/images:/app/public/images
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
