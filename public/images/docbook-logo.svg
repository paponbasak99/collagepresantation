<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#glow)"/>
  <!-- Medical Cross & Pulse Wave -->
  <g fill="#ffffff" transform="translate(106, 106)">
    <!-- Shield / Heart silhouette -->
    <path d="M150 20 C220 20 280 60 280 140 C280 230 150 280 150 280 C150 280 20 230 20 140 C20 60 80 20 150 20 Z" fill="rgba(255,255,255,0.15)"/>
    <!-- Medical Cross -->
    <rect x="125" y="60" width="50" height="160" rx="12" fill="#ffffff"/>
    <rect x="70" y="115" width="160" height="50" rx="12" fill="#ffffff"/>
    <circle cx="150" cy="140" r="18" fill="#0d9488"/>
  </g>
</svg>
