<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Token & Slip — DocBook</title>
  <meta name="description" content="Official outpatient appointment slip with cryptographic QR verification, consultation serial number, and chamber directions.">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/3d.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d7a71' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3Cpolyline points='9 12 11 14 15 10'/%3E%3C/svg%3E">
  <style>
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .no-print {
        display: none !important;
      }
      .appointment-slip {
        border: 1.5px solid #000000 !important;
        box-shadow: none !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 12mm !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .slip-serial-card {
        background: #000000 !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .slip-perforation {
        border-top: 1.5px dashed #000000 !important;
      }
      .slip-perforation::before,
      .slip-perforation::after {
        display: none !important;
      }
      .badge {
        border: 1px solid #000000 !important;
        background: transparent !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-mount" class="no-print"></div>

  <div class="container" style="padding: var(--space-8) var(--space-4);">
    <!-- Action Bar (Hidden during print) -->
    <div class="no-print" style="max-width: 620px; margin: 0 auto var(--space-5); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-3);">
      <a href="/my-appointments.html" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.35rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>My Appointments</span>
      </a>
      <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
        <button id="copy-slip-link-btn" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.35rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <span>Share Slip</span>
        </button>
        <button id="print-slip-btn" class="btn btn-primary btn-sm" style="display: inline-flex; align-items: center; gap: 0.35rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          <span>Print / Save PDF</span>
        </button>
      </div>
    </div>

    <!-- Printable Slip Card with Physical Ticket Styling -->
    <div id="slip-card" class="appointment-slip">
      <div style="text-align: center; color: var(--color-ink-500); padding: var(--space-8);">Retrieving verified appointment token...</div>
    </div>
  </div>

  <div id="footer-mount" class="no-print"></div>

  <script type="module">
    import { api } from '/js/api.js';
    import { renderNavbar, renderFooter } from '/js/navbar.js';
    import { showToast } from '/js/toast.js';
    import { icons } from '/js/icons.js';

    renderNavbar();
    renderFooter();

    const urlParams = new URLSearchParams(window.location.search);
    const appointmentRef = urlParams.get('id') || urlParams.get('number');

    if (!appointmentRef) {
      window.location.href = '/my-appointments.html';
    }

    async function loadSlip() {
      try {
        const res = await api.get(`/appointments/${encodeURIComponent(appointmentRef)}/slip`);
        const slip = res.data;

        const isPaid = slip.payment_status === 'PAID';
        const payBadgeClass = isPaid ? 'badge-success' : 'badge-warning';
        const payStatusText = isPaid ? `PAID (${slip.payment_method})` : 'PAYMENT PENDING (Pay at Clinic)';

        // Stepper state computation
        const statusOrder = ['CONFIRMED', 'ARRIVED', 'IN_CONSULTATION', 'COMPLETED'];
        const currentIdx = statusOrder.indexOf(slip.status);

        const slipContainer = document.getElementById('slip-card');
        slipContainer.innerHTML = `
          <!-- Header -->
          <div class="slip-header" style="text-align: center; margin-bottom: var(--space-4);">
            <div style="display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin-bottom: 0.15rem;">
              <span style="color: var(--color-teal-700);">${icons.stethoscope(22)}</span>
              <h2 style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0; letter-spacing: -0.01em;">DocBook Healthcare</h2>
            </div>
            <p style="font-size: 0.8125rem; color: #64748b; margin: 0 0 var(--space-2);">Official Outpatient Consultation Token • Dinajpur Network</p>
            <div style="display: inline-block; background: #f1f5f9; padding: 0.25rem 0.65rem; border-radius: 4px; font-size: 0.75rem; color: #334155;">
              Token Ref: <strong style="font-family: var(--font-mono); font-size: 0.875rem;">${slip.appointment_number}</strong>
            </div>
          </div>

          <!-- Journey Status Stepper -->
          <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);">
            <div style="display: flex; justify-content: space-between; position: relative;">
              <div style="text-align: center; flex: 1;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: ${currentIdx >= 0 ? '#0d7a71' : '#cbd5e1'}; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">1</div>
                <div style="font-size: 0.6875rem; font-weight: ${currentIdx === 0 ? '700' : '500'}; color: ${currentIdx >= 0 ? '#0f172a' : '#94a3b8'}; margin-top: 0.25rem; text-transform: uppercase;">Booked</div>
              </div>
              <div style="text-align: center; flex: 1;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: ${currentIdx >= 1 ? '#0d7a71' : '#cbd5e1'}; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">2</div>
                <div style="font-size: 0.6875rem; font-weight: ${currentIdx === 1 ? '700' : '500'}; color: ${currentIdx >= 1 ? '#0f172a' : '#94a3b8'}; margin-top: 0.25rem; text-transform: uppercase;">Arrived</div>
              </div>
              <div style="text-align: center; flex: 1;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: ${currentIdx >= 2 ? '#0d7a71' : '#cbd5e1'}; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">3</div>
                <div style="font-size: 0.6875rem; font-weight: ${currentIdx === 2 ? '700' : '500'}; color: ${currentIdx >= 2 ? '#0f172a' : '#94a3b8'}; margin-top: 0.25rem; text-transform: uppercase;">In Chamber</div>
              </div>
              <div style="text-align: center; flex: 1;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: ${currentIdx >= 3 ? '#0d7a71' : '#cbd5e1'}; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">4</div>
                <div style="font-size: 0.6875rem; font-weight: ${currentIdx === 3 ? '700' : '500'}; color: ${currentIdx >= 3 ? '#0f172a' : '#94a3b8'}; margin-top: 0.25rem; text-transform: uppercase;">Completed</div>
              </div>
            </div>
          </div>

          <!-- Perforated Notch Divider -->
          <div class="slip-perforation"></div>

          <!-- Big Serial Number Box -->
          <div class="slip-serial-card">
            <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85;">Outpatient Queue Serial</div>
            <h2 style="font-family: var(--font-display);">${slip.serial_badge}</h2>
            <div style="font-size: 0.8125rem; margin-top: 0.25rem; opacity: 0.95;">
              Reporting Time: <strong style="font-family: var(--font-mono); font-size: 0.875rem;">${slip.reporting_time}</strong> (Session: ${slip.time})
            </div>
          </div>

          <!-- Doctor & Chamber Info -->
          <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: var(--space-4); margin-bottom: var(--space-4);">
            <div style="font-size: 0.6875rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;">Attending Specialist & Chamber</div>
            <h3 style="font-size: 1.125rem; font-weight: 700; color: #0f172a; margin: 0.25rem 0 0.15rem;">${slip.doctor_name}</h3>
            <div style="font-size: 0.8125rem; color: #0d7a71; font-weight: 600; margin-bottom: 0.35rem;">
              ${slip.specialty_name_en} — BMDC Reg: ${slip.bmdc_reg_no}
            </div>
            <div style="font-size: 0.8125rem; color: #334155; line-height: 1.4;">
              <strong>${slip.hospital_name_en}</strong><br>
              ${slip.chamber_address}
            </div>
          </div>

          <!-- Patient Info Grid -->
          <div class="slip-details-grid">
            <div>
              <div style="font-size: 0.6875rem; color: #64748b; text-transform: uppercase; font-weight: 600;">Patient Name</div>
              <div style="font-weight: 700; color: #0f172a;">${slip.patient_name}</div>
            </div>
            <div>
              <div style="font-size: 0.6875rem; color: #64748b; text-transform: uppercase; font-weight: 600;">Mobile</div>
              <div style="font-weight: 600; color: #0f172a;">${slip.patient_phone}</div>
            </div>
            <div>
              <div style="font-size: 0.6875rem; color: #64748b; text-transform: uppercase; font-weight: 600;">Age & Gender</div>
              <div style="font-weight: 600; color: #0f172a;">${slip.patient_age} Yrs / ${slip.patient_gender}</div>
            </div>
            <div>
              <div style="font-size: 0.6875rem; color: #64748b; text-transform: uppercase; font-weight: 600;">Date of Visit</div>
              <div style="font-weight: 700; color: #0d7a71;">${slip.date}</div>
            </div>
          </div>

          <!-- Visit Reason -->
          <div style="font-size: 0.8125rem; margin-bottom: var(--space-4); background: #f8fafc; padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid #e2e8f0;">
            <span style="color: #64748b; text-transform: uppercase; font-size: 0.6875rem; font-weight: 600; display: block; margin-bottom: 0.15rem;">Reason for Consultation</span>
            <strong style="color: #0f172a;">${slip.reason_for_visit}</strong>
          </div>

          <!-- Payment Stamp -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: var(--space-3); margin-bottom: var(--space-4);">
            <div>
              <div style="font-size: 0.6875rem; color: #64748b; text-transform: uppercase; font-weight: 600;">Consultation Fee</div>
              <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; font-feature-settings: 'tnum';">৳ ${slip.fee_amount}</div>
            </div>
            <div class="badge ${payBadgeClass}" style="font-size: 0.75rem; padding: 0.35rem 0.75rem;">
              ${payStatusText}
            </div>
          </div>

          ${slip.status === 'COMPLETED' ? `
            <div class="no-print" style="margin-bottom: var(--space-4); text-align: center;">
              <a href="/prescription-slip.html?id=${slip.id}" class="btn btn-primary btn-sm" style="width: 100%;">
                View Official Digital Prescription
              </a>
            </div>
          ` : ''}

          <!-- QR Verification Box -->
          <div class="slip-qr-box">
            <img src="${slip.qr_code_data_url}" alt="Verification QR Code" style="width: 130px; height: 130px; object-fit: contain; border: 1px solid #e2e8f0; padding: 4px; border-radius: 4px; background: white;">
            <div style="font-size: 0.6875rem; color: #64748b; margin-top: var(--space-2); text-align: center;">
              Scan QR to verify authentic cryptographic token • DocBook Hospital Registry
            </div>
          </div>
        `;

        document.getElementById('print-slip-btn').addEventListener('click', () => {
          window.print();
        });

        document.getElementById('copy-slip-link-btn')?.addEventListener('click', () => {
          const verifyUrl = `${window.location.origin}/verify-slip.html?number=${slip.appointment_number}`;
          navigator.clipboard.writeText(verifyUrl).then(() => {
            showToast('Verification link copied to clipboard!', 'success');
          }).catch(() => {
            showToast(verifyUrl, 'info');
          });
        });

        import('/js/3d/slip-scene.js').then(m => m.initSlipScene(document.getElementById('slip-card'))).catch(() => {});

      } catch (err) {
        console.error('Failed to load appointment slip:', err);
        showToast('Unable to load appointment slip.', 'error');
      }
    }

    loadSlip();
  </script>
  <script type="module" src="/js/3d/core.js"></script>
</body>
</html>
